<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f6db0" />
      <stop offset="50%" stop-color="#4aa3e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Comic badge circle background -->
  <circle cx="32" cy="32" r="30" fill="#0d1b2e" stroke="#f28a4b" stroke-width="3.5" />
  <circle cx="32" cy="32" r="26" fill="#16304f" />
  <!-- Radiant sword -->
  <g filter="url(#glow)">
    <line x1="16" y1="48" x2="48" y2="16" stroke="url(#blade)" stroke-width="5" stroke-linecap="round" />
    <!-- Crossguard -->
    <line x1="22" y1="36" x2="34" y2="48" stroke="#f1ead9" stroke-width="4" stroke-linecap="round" />
    <!-- Hilt -->
    <line x1="14" y1="50" x2="20" y2="44" stroke="#f28a4b" stroke-width="4.5" stroke-linecap="round" />
  </g>
  <!-- Sparkles -->
  <text x="46" y="20" fill="#f5dd7a" font-family="sans-serif" font-size="14" font-weight="bold">✦</text>
  <text x="12" y="24" fill="#4aa3e8" font-family="sans-serif" font-size="10" font-weight="bold">✦</text>
</svg>
